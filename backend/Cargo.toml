[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
local-ip-address = "0.6.11"
pnet_datalink = "0.35.0"
reqwest = "0.13.2"
battery = { package = "starship-battery", version = "*" }
strum = "0.28.0"
strum_macros = "0.28.0"
sysinfo = "0.38.4"
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread"] }
uom = "0.38.0"
wifiscanner = { git = "https://github.com/gianzellweger/wifiscanner.git", features = ["compile-anyway"] }
btleplug = "0.12.0"
display-info = "0.5.9"
ipnetwork = "0.21.1"
